<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="50%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- AMOLED Dark Rounded Background -->
  <rect width="64" height="64" rx="18" fill="#050505"/>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Left Wedding Ring -->
  <circle cx="25" cy="37" r="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="3.2" filter="url(#softGlow)"/>

  <!-- Right Wedding Ring -->
  <circle cx="39" cy="37" r="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="3.2" filter="url(#softGlow)"/>

  <!-- Interlocking ring segment overlap -->
  <path d="M 32 25.5 A 12.5 12.5 0 0 1 37 37" fill="none" stroke="url(#goldGrad)" stroke-width="3.2"/>

  <!-- Cute Glowing Heart at the Top Center -->
  <path d="M 32 23 C 32 23 23.5 14.5 23.5 10 C 23.5 6.5 26.5 4 29.8 4 C 31.5 4 32 4.8 32 4.8 C 32 4.8 32.5 4 34.2 4 C 37.5 4 40.5 6.5 40.5 10 C 40.5 14.5 32 23 32 23 Z" fill="url(#roseGrad)" filter="url(#softGlow)"/>

  <!-- Little Cute Sparkle Star -->
  <polygon points="17,13 18.5,17 22.5,18.5 18.5,20 17,24 15.5,20 11.5,18.5 15.5,17" fill="#FFF176"/>
  <circle cx="48" cy="19" r="1.5" fill="#FFE082"/>
</svg>
