    <!-- Dynamic Domain Origin Syncer for Client-Side Shares & iOS Safari Preview Resolution -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location && window.location.origin) {
            var origin = window.location.origin;
            var currentFullUrl = window.location.href.split('#')[0];
            
            // Sync canonical URL
            var canonical = document.querySelector('link[rel="canonical"]');
            if (!canonical) {
              canonical = document.createElement('link');
              canonical.setAttribute('rel', 'canonical');
              document.head.appendChild(canonical);
            }
            canonical.setAttribute('href', currentFullUrl);

            // Sync og:url
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
              ogUrl.setAttribute('content', currentFullUrl);
            }

            // Sync apple-touch-icon
            var appleLink = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleLink) {
              appleLink.setAttribute('href', origin + '/apple-touch-icon.png');
            }

            // Sync image_src to wmeta.png
            var imgSource = document.querySelector('link[rel="image_src"]');
            if (imgSource) {
              imgSource.setAttribute('href', origin + '/wmeta.png');
            }

            // Dynamically update all meta image content tags to active origin if running on dev domain or custom host
            var metaImgs = document.querySelectorAll('meta[property="og:image"], meta[property="og:image:secure_url"], meta[name="twitter:image"], meta[itemprop="image"]');
            metaImgs.forEach(function(el) {
              var curr = el.getAttribute('content');
              if (curr) {
                if (curr.startsWith('/')) {
                  el.setAttribute('content', origin + curr);
                } else if (curr.includes('run.app') || curr.includes('localhost')) {
                  var path = curr.replace(/^https?:\/\/[^\/]+/, '');
                  el.setAttribute('content', origin + path);
                }
              }
            });
          }
        } catch (e) {}
      })();
    </script>
