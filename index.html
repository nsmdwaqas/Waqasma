    <!-- Dynamic Domain Origin Syncer for Client-Side Shares -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location.origin) {
            var origin = window.location.origin;
            var fullPng = origin + '/metaa.png';
            var fullApple = origin + '/apple-touch-icon.png';
            
            var metaImgs = document.querySelectorAll('meta[property="og:image"], meta[property="og:image:secure_url"], meta[name="twitter:image"], meta[itemprop="image"]');
            metaImgs.forEach(function(el) {
              var curr = el.getAttribute('content');
              if (curr && curr.startsWith('/')) {
                el.setAttribute('content', origin + curr);
              }
            });

            var appleLink = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleLink) appleLink.setAttribute('href', fullApple);

            var imgSource = document.querySelector('link[rel="image_src"]');
            if (imgSource) imgSource.setAttribute('href', fullPng);

            var canonical = document.querySelector('link[rel="canonical"]');
            if (!canonical) {
              canonical = document.createElement('link');
              canonical.setAttribute('rel', 'canonical');
              document.head.appendChild(canonical);
            }
            canonical.setAttribute('href', window.location.href.split('#')[0]);
          }
        } catch (e) {}
      })();
    </script>
